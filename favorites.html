  <style>
    .profile-layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; }
    .profile-sidebar { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; position: sticky; top: 100px; align-self: flex-start; }
    .profile-cover { height: 100px; background: linear-gradient(135deg, var(--pink), var(--coral)); }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--white); border: 4px solid var(--white); margin: -40px auto 0; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: var(--shadow-sm); }
    .profile-name { text-align: center; padding: 12px 20px 4px; font-size: 1.1rem; font-weight: 600; }
    .sidebar-nav { padding: 16px 0; }
    .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 12px 24px; font-size: 0.9rem; color: var(--text); transition: var(--transition); }
    .sidebar-nav a:hover { background: rgba(255,182,193,0.08); color: var(--pink-dark); }
    .sidebar-nav a.active { color: var(--pink-dark); font-weight: 600; background: rgba(255,182,193,0.1); border-right: 3px solid var(--pink-dark); }
    .fav-tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid var(--light-gray); }
    .fav-tab { padding: 12px 24px; font-weight: 600; color: var(--text-light); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; transition: var(--transition); font-size: 0.9rem; }
    .fav-tab.active { color: var(--pink-dark); border-bottom-color: var(--pink-dark); }
    .fav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .fav-card { background: var(--white); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); transition: var(--transition); position: relative; }
    .fav-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .fav-card .fav-img { height: 160px; overflow: hidden; }
    .fav-card .fav-img .img-placeholder { width: 100%; height: 100%; transition: transform 0.5s; }
    .fav-card:hover .fav-img .img-placeholder { transform: scale(1.06); }
    .fav-card .fav-body { padding: 16px; }
    .fav-card .fav-body h3 { font-size: 1rem; margin-bottom: 4px; }
    .fav-card .fav-body p { font-size: 0.8rem; color: var(--text-light); margin-bottom: 8px; }
    .fav-card .fav-price { font-size: 1.1rem; font-weight: bold; color: var(--coral-dark); }
    .fav-card .fav-price span { font-size: 0.8rem; color: var(--text-light); font-weight: normal; }
    .fav-card .remove-btn { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.4); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; cursor: pointer; transition: var(--transition); opacity: 0; }
    .fav-card:hover .remove-btn { opacity: 1; }
    .fav-card .remove-btn:hover { background: #FF4466; }
    @media (max-width: 1024px) { .fav-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .profile-layout { grid-template-columns: 1fr; } .profile-sidebar { position: static; } .fav-grid { grid-template-columns: 1fr; } }
  </style>
</head>

  <script>
    var FAV_DATA = {
      'tokyo': { name: '🇯🇵 日本东京', desc: '5天4晚 · 樱花季', price: '¥5,999', gradient: 'linear-gradient(135deg,#FFB6C1,#FF8FA3)', href: 'destination-tokyo.html' },
      'paris': { name: '🇫🇷 法国巴黎', desc: '7天6晚 · 浪漫之都', price: '¥12,999', gradient: 'linear-gradient(135deg,#87CEEB,#6BC4A6)', href: 'destination-paris.html' },
      'phuket': { name: '🇹🇭 泰国普吉岛', desc: '5天4晚 · 海岛天堂', price: '¥3,999', gradient: 'linear-gradient(135deg,#FFF5BA,#FFA07A)', href: 'destination-phuket.html' },
      'hotel_sakura': { name: '🌸 樱花和风旅馆', desc: '东京浅草 · 五星级', price: '¥896/晚', gradient: 'linear-gradient(135deg,#FFB6C1,#FF8FA3)', href: 'hotel-detail.html' }
    };
    function renderFavorites() {
      var favs = getStorage('kawaii_favorites', []);
      var grid = document.getElementById('favGrid');
      var empty = document.getElementById('emptyFav');
      var cnt = document.getElementById('favCount');
      if (cnt) cnt.textContent = '收藏 (' + favs.length + ')';
      grid.innerHTML = '';
      if (favs.length === 0) {
        grid.appendChild(empty);
        empty.style.display = 'block';
        return;
      }
      favs.forEach(function(id) {
        var d = FAV_DATA[id];
        if (!d) return;
        var card = document.createElement('div');
        card.className = 'fav-card scroll-animate visible';
        card.innerHTML = '<div class="fav-img"><div class="img-placeholder" style="background:' + d.gradient + ';"></div></div>' +
          '<div class="remove-btn" onclick="removeFav(\'' + id + '\')">✕</div>' +
          '<div class="fav-body"><h3>' + d.name + '</h3><p>' + d.desc + '</p><div class="fav-price">' + d.price + ' <span>/人起</span></div>' +
          '<a href="' + d.href + '" class="btn btn-secondary btn-small" style="margin-top:8px;">查看详情</a></div>';
        grid.appendChild(card);
      });
    }
    function removeFav(id) {
      Favorites.toggle(id);
      renderFavorites();
    }
    document.addEventListener('DOMContentLoaded', renderFavorites);
  </script>
