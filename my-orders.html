<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的订单 - 萌趣旅行</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .profile-layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; }
    .profile-sidebar { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; position: sticky; top: 100px; align-self: flex-start; }
    .profile-cover { height: 100px; background: linear-gradient(135deg, var(--pink), var(--coral)); }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--white); border: 4px solid var(--white); margin: -40px auto 0; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: var(--shadow-sm); }
    .profile-name { text-align: center; padding: 12px 20px 4px; font-size: 1.1rem; font-weight: 600; }
    .sidebar-nav { padding: 16px 0; }
    .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 12px 24px; font-size: 0.9rem; color: var(--text); transition: var(--transition); }
    .sidebar-nav a:hover { background: rgba(255,182,193,0.08); color: var(--pink-dark); }
    .sidebar-nav a.active { color: var(--pink-dark); font-weight: 600; background: rgba(255,182,193,0.1); border-right: 3px solid var(--pink-dark); }
    .orders-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .order-tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid var(--light-gray); }
    .order-tab { padding: 12px 24px; font-weight: 600; color: var(--text-light); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; transition: var(--transition); font-size: 0.9rem; }
    .order-tab.active { color: var(--pink-dark); border-bottom-color: var(--pink-dark); }
    .order-card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 16px; overflow: hidden; }
    .order-card-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--off-white); border-bottom: 1px solid var(--light-gray); font-size: 0.85rem; color: var(--text-light); }
    .order-card-body { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
    .order-card-body .order-info h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .order-card-body .order-info p { font-size: 0.85rem; color: var(--text-light); }
    .order-card-body .order-price { text-align: right; }
    .order-card-body .order-price .price { font-size: 1.3rem; font-weight: bold; color: var(--coral-dark); }
    .order-card-body .order-price .status { margin-top: 4px; }
    .order-status { display: inline-block; padding: 4px 14px; border-radius: var(--radius-xl); font-size: 0.75rem; font-weight: 600; }
    .status-confirmed { background: rgba(152,216,200,0.2); color: var(--mint-dark); }
    .status-pending { background: rgba(255,245,186,0.4); color: #B8860B; }
    .status-completed { background: rgba(135,206,235,0.2); color: #4A90B8; }
    .status-cancelled { background: rgba(255,182,193,0.2); color: var(--pink-dark); }
    .order-actions { padding: 12px 24px; border-top: 1px solid var(--light-gray); display: flex; gap: 8px; justify-content: flex-end; }
    @media (max-width: 768px) { .profile-layout { grid-template-columns: 1fr; } .profile-sidebar { position: static; } .order-card-body { flex-direction: column; align-items: flex-start; gap: 12px; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo"><span class="logo-icon">✈️</span> 萌趣旅行</a>
      <div class="nav-links"><a href="index.html">首页</a><a href="destinations.html">目的地</a><a href="hotels.html">酒店</a><a href="flights.html">机票</a><a href="guides.html">攻略</a><a href="about.html">关于我们</a></div>
      <div class="nav-actions"><a href="login.html" class="btn btn-secondary btn-small">登录</a><a href="register.html" class="btn btn-primary btn-small">注册</a></div>
      <div class="hamburger"><span></span><span></span><span></span></div>
    </div>
  </nav>
  <div class="mobile-menu"><span class="mobile-close">&times;</span><a href="index.html">首页</a><a href="destinations.html">目的地</a><a href="hotels.html">酒店</a><a href="flights.html">机票</a><a href="guides.html">攻略</a><a href="about.html">关于我们</a><a href="login.html">登录</a><a href="register.html">注册</a></div>

  <section class="section" style="padding-top: 100px;">
    <div class="container">
      <div class="profile-layout">
        <div class="profile-sidebar scroll-animate">
          <div class="profile-cover"></div>
          <div class="profile-avatar" id="sideAvatar">🧸</div>
          <div class="profile-name" id="sideName">萌趣用户</div>
          <nav class="sidebar-nav">
            <a href="profile.html">📊 个人中心</a>
            <a href="my-orders.html" class="active">📋 我的订单</a>
            <a href="favorites.html">💖 我的收藏</a>
            <a href="settings.html">⚙️ 账户设置</a>
            <a href="#" onclick="Auth.logout(); window.location.href='index.html'; return false;">🚪 退出登录</a>
          </nav>
        </div>

        <div class="profile-main">
          <div class="orders-header scroll-animate">
            <h2 style="font-size:1.4rem;">📋 我的订单</h2>
          </div>
          <div class="order-tabs scroll-animate">
            <div class="order-tab active" onclick="filterOrders('all')">全部</div>
            <div class="order-tab" onclick="filterOrders('pending')">待支付</div>
            <div class="order-tab" onclick="filterOrders('confirmed')">已确认</div>
            <div class="order-tab" onclick="filterOrders('completed')">已完成</div>
            <div class="order-tab" onclick="filterOrders('cancelled')">已取消</div>
          </div>
          <div id="ordersContainer"></div>
          <div id="emptyOrders" style="display:none;text-align:center;padding:40px;color:var(--text-light);">
            <div style="font-size:3rem;margin-bottom:12px;">📭</div>
            <h3>暂无订单</h3>
            <p style="margin-top:8px;">去探索目的地，开启你的萌趣之旅吧！</p>
            <a href="destinations.html" class="btn btn-primary" style="margin-top:16px;">去探索</a>
          </div>
        </div>
      </div>
    </div>
  </section></section>
